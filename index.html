<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Brand assets, all served from public/. -->
		<link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
		<link rel="apple-touch-icon" href="/pwa-icon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Updated by useTheme when the user switches themes. -->
		<meta name="theme-color" content="#ffffff" />
		<meta name="application-name" content="DabSudoku" />
		<!-- Lets iOS launch the game full-screen once it is added to the home screen. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="DabSudoku" />
		<title>DabSudoku | A Calm Puzzle Break</title>
		<meta
			name="description"
			content="Play DabSudoku with four difficulty levels, notes, hints and a timer. A quiet, focused puzzle game."
		/>

		<meta property="og:type" content="website" />
		<meta property="og:title" content="DabSudoku — a calm puzzle break" />
		<meta
			property="og:description"
			content="Four difficulties, pencil notes, hints and a timer. Fill every row, column and box with 1–9."
		/>
		<meta property="og:image" content="/og.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="720" />
		<meta property="og:image:alt" content="The DabSudoku logo: a sudoku grid with a purple pie mark in the centre." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="DabSudoku — a calm puzzle break" />
		<meta
			name="twitter:description"
			content="Four difficulties, pencil notes, hints and a timer. Fill every row, column and box with 1–9."
		/>
		<meta name="twitter:image" content="/og.jpg" />
		<meta name="twitter:image:alt" content="The DabSudoku logo: a sudoku grid with a purple pie mark in the centre." />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<script>
			// Applies the saved theme before first paint so the page never flashes
			// the wrong one. Keep the storage key in sync with src/hooks/useTheme.ts.
			(function () {
				var theme = 'light';
				try {
					var stored = localStorage.getItem('dabsudoku.theme.v1');
					if (stored === 'light' || stored === 'dark') {
						theme = stored;
					} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
						theme = 'dark';
					}
				} catch (error) {
					theme = 'light';
				}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
